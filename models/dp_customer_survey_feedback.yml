version: 2

models:
  - name: dp_customer_survey_feedback
    description: >
      Customer satisfaction surveys collected after each rental.
      Enriched with NPS category, rating sentiment, and customer
      segments from CRM domain to enable cross-domain analysis
      such as sentiment analysis, loyalty tracking, and segmentation.

    config:
      meta:
        domain: crm
        data_product: customer_survey_feedback

    columns:
      - name: response_id
        description: Unique survey response identifier
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer identifier linked to CRM profile
        tests:
          - not_null

      - name: rental_id
        description: Rental identifier the survey refers to
        tests:
          - not_null

      - name: inventory_id
        description: Vehicle inventory identifier from the rental

      - name: staff_id
        description: Staff member identifier who handled the rental

      - name: store_id
        description: Store identifier where the rental took place

      - name: survey_timestamp
        description: Timestamp when the survey was submitted, one day after payment

      - name: rating_overall
        description: Overall satisfaction rating on a scale of 1 to 5
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: rating_service
        description: Staff service quality rating on a scale of 1 to 5
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: rating_price
        description: Price satisfaction rating on a scale of 1 to 5
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: rating_vehicle
        description: Vehicle quality rating on a scale of 1 to 5
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: nps_score
        description: Net Promoter Score on a scale of 0 to 10

      - name: nps_category
        description: >
          NPS category derived from nps_score:
          promoter (9-10), passive (7-8), detractor (0-6)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['promoter', 'passive', 'detractor']

      - name: rating_category
        description: >
          Overall sentiment derived from rating_overall:
          positive (4-5), neutral (3), negative (1-2)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']

      - name: comment_text
        description: Free-text comment left by the customer, intended for NLP analysis

      - name: location
        description: Country of the store where the rental took place

      - name: device_type
        description: Device used to submit the survey
        tests:
          - accepted_values:
              arguments:
                values: ['mobile', 'desktop']

      - name: age_segment
        description: >
          Customer age segment from dp_customer_mobility_profile:
          young, adult, senior, unknown

      - name: mobility_segment
        description: >
          Customer mobility segment from dp_customer_mobility_profile:
          casual_user, regular_user, power_user