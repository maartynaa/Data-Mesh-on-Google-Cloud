version: 2

models:
  - name: dp_customer_segmentation
    description: >
      Customer segmentation data product combining secure customer profile
      with sales activity. Produces behavioral segments used for analytics,
      reporting and marketing use cases.

    config:
      meta:
        domain: crm
        data_product: customer_segmentation

    columns:
      - name: customer_id
        description: Unique identifier of the customer
        tests:
          - not_null

      - name: age_segment
        description: Age-based segmentation derived from secure customer profile

      - name: city
        description: Customer city

      - name: country
        description: Customer country

      - name: rental_count
        description: Number of rentals per customer

      - name: total_paid_amount
        description: Total amount paid by customer

      - name: unpaid_rentals_count
        description: Number of unpaid rentals

      - name: segment
        description: >
          Behavioral segment derived from sales and payment behavior:
          high_value (total_paid_amount > 1000),
          risky (unpaid_rentals_count > 2),
          standard (default)
        tests:
          - not_null
          - accepted_values:
              values: ['high_value', 'risky', 'standard']