version: 2

models:
  - name: dp_customer_mobility_profile
    description: >
      Unified customer mobility profile combining CRM customer data,
      rental activity from Sales domain, and vehicle catalog information
      from Fleet domain to support customer segmentation, mobility analytics,
      and personalized vehicle recommendations.

    config:
      meta:
        domain: crm
        data_product: customer_mobility_profile

    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - not_null
          - unique

      - name: age_segment
        description: >
          Customer age segment derived from CRM profile:
          young, adult, senior, unknown
        tests:
          - accepted_values:
              arguments:
                values: ['young', 'adult', 'senior', 'unknown']

      - name: country
        description: Customer country from CRM profile

      - name: rental_count
        description: Total number of rentals performed by the customer

      - name: last_rental_date
        description: Date of the latest rental activity

      - name: total_expected_rental_amount
        description: Sum of all expected rental payments

      - name: total_paid_amount
        description: Sum of all actual payments made by the customer

      - name: payment_status
        description: >
          Customer payment standing derived from unpaid and late rental counts:
          has_unpaid, has_late, good_standing
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['has_unpaid', 'has_late', 'good_standing']

      - name: mobility_segment
        description: >
          Behavioral mobility segment derived from rental_count:
          casual_user (< 5), regular_user (5–9), power_user (>= 10)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['casual_user', 'regular_user', 'power_user']

      - name: recommended_brand
        description: Recommended vehicle producer matched to mobility segment

      - name: recommended_model
        description: Recommended vehicle model matched to mobility segment

      - name: fuel_type
        description: Fuel type of the recommended vehicle

      - name: vehicle_segment
        description: >
          Vehicle pricing tier derived from rental_rate:
          budget (< 150), standard (150–220), premium (> 220)
        tests:
          - accepted_values:
              arguments:
                values: ['budget', 'standard', 'premium']