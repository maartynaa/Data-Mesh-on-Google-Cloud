version: 2

models:
  - name: dp_customer_profile_secure
    description: >
      Restricted-access customer profile containing raw PII data
      including full name, email address, and postal address.
      Intended exclusively for authorized internal CRM use cases
      requiring access to personal data. Access limited to authorized
      service accounts within the CRM domain.

    config:
      meta:
        domain: crm
        data_product: customer_profile_secure
        access: restricted

    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - not_null
          - unique

      - name: first_name
        description: Customer first name (raw PII)

      - name: last_name
        description: Customer last name (raw PII)

      - name: email
        description: Customer email address (raw PII)
        tests:
          - not_null

      - name: is_valid_email
        description: Boolean flag indicating whether the email address is valid

      - name: birth_date
        description: Customer date of birth (raw PII)

      - name: age
        description: Customer age in years derived from birth_date

      - name: age_segment
        description: >
          Customer age segment derived from age:
          young (< 25), adult (25-50), senior (> 50), unknown
        tests:
          - accepted_values:
              arguments:
                values: ['young', 'adult', 'senior', 'unknown']

      - name: create_date
        description: Date when the customer account was created

      - name: customer_last_update
        description: Timestamp of the last update to the customer record

      - name: address
        description: Customer street address (raw PII)

      - name: postal_code
        description: Customer postal code (raw PII)

      - name: city
        description: City of the customer

      - name: country
        description: Country of the customer