id: customer_profile_secure
domain: crm
owner: crm_team

description: >
  Restricted version of customer profile data product with
  additional filtering for sensitive or limited-access use cases.

inputs:
  - wheelie.customer
  - wheelie.address
  - wheelie.city
  - wheelie.country

outputs:
  - name: customer_profile_secure

data_quality:
  - customer_id must be unique
  - email must not be null

