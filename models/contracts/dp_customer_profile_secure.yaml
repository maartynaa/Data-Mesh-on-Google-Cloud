version: 2

models:
  - name: dp_customer_profile_secure

    description: >
      Restricted customer profile containing raw PII data.
      Data sourced from wheelie via int_customer_enriched.
      This layer provides controlled access to sensitive customer attributes
      for internal CRM use cases.

    config:
      materialized: table
      schema: crm_secure
      contract:
        enforced: true

    meta:
      contract:
        id: dp_customer_profile_secure
        version: 1.3.0
        domain: crm
        owner: crm_team

        address: bw-bigdata-2026-data-mesh.crm_secure.dp_customer_profile_secure

        grain: one row per customer

        primary_key:
          - customer_id

        refresh: daily

        consumers:
          - crm_team

        sources:
          - int_customer_enriched

        sla:
          freshness: daily
          availability: 99%

    columns:
      - name: customer_id
        data_type: string
        tests:
          - not_null
          - unique

      - name: first_name
        data_type: string

      - name: last_name
        data_type: string

      - name: email
        data_type: string

      - name: is_valid_email
        data_type: boolean

      - name: birth_date
        data_type: date

      - name: age
        data_type: int64

      - name: create_date
        data_type: timestamp

      - name: customer_last_update
        data_type: timestamp

      - name: address
        data_type: string

      - name: postal_code
        data_type: string

      - name: city
        data_type: string

      - name: country
        data_type: string