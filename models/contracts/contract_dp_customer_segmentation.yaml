id: customer_segmentation
domain: crm
owner: crm_team

description: >
  Customer segmentation data product combining customer profile
  and sales activity to generate behavioral segments.

data_product: dp_customer_segmentation

inputs:
  - dp_customer_profile_secure
  - stg_sales__customer_activity

depends_on:
  - dp_customer_profile_secure

sla:
  freshness: daily
  availability: 99%

use_cases:
  - RFM segmentation
  - marketing analytics
  - customer value analysis

business_rules:
  - high_value: total_paid_amount > 1000
  - risky: unpaid_rentals_count > 2
  - standard: default segment