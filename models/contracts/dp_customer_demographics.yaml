version: 2

models:
  - name: dp_customer_demographics

    description: >
      Produkt danych referencyjnych definiujący ustandaryzowaną segmentację wieku klientów. 
      Jest to pojedyncze, wiarygodne źródło prawdy dla klasyfikacji demograficznej 
      wykorzystywanej w różnych produktach danych 
      (dp_customer_profile, dp_customer_mobility_profile, dp_customer_survey_feedback).

    config:
      materialized: table
      schema: crm_data_products
      contract:
        enforced: true

    meta:
      contract:
        id: dp_customer_demographics
        version: 1.0.0
        domain: crm
        owner: crm_team

        address: bw-bigdata-2026-data-mesh.crm_data_products.dp_customer_demographics

        grain: one row per customer

        primary_key:
          - customer_id

        refresh: daily

        consumers:
          - dp_customer_profile
          - dp_customer_mobility_profile
          - dp_customer_survey_feedback

        sources:
          - dp_customer_profile

        sla:
          freshness: daily
          availability: 99%

    columns:
      - name: customer_id
        description: Unikalny identyfikator klienta.
        data_type: string
        tests:
          - not_null
          - unique

      - name: age
        description: Wiek klienta wyliczony na podstawie daty urodzenia (birth_date).
        data_type: integer

      - name: age_segment
        description: >
          Ustandaryzowana segmentacja wieku: 
          młody (<25), 
          dorosły (25–50), 
          senior (>50), 
          nieznany (wiek nieokreślony / brak danych).
        data_type: string
        tests:
          - accepted_values:
              values: ['young', 'adult', 'senior', 'unknown']