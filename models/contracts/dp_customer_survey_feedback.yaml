version: 2

models:
  - name: dp_customer_survey_feedback

    description: >
      Customer survey feedback data product enriched with standardized
      demographic segmentation from dp_customer_demographics and NPS-based
      sentiment classification. Used for customer experience analytics
      and loyalty tracking.

    config:
      materialized: table
      schema: crm_data_products
      contract:
        enforced: true

    meta:
      contract:
        id: dp_customer_survey_feedback
        version: 1.1.0
        domain: crm
        owner: crm_team

        address: bw-bigdata-2026-data-mesh.crm_data_products.dp_customer_survey_feedback

        grain: one row per survey response

        primary_key:
          - response_id

        refresh: daily

        consumers:
          - crm_team
          - analytics_team

        sources:
          - stg_survey__responses
          - dp_customer_demographics

        sla:
          freshness: daily
          availability: 99%

    columns:
      - name: response_id
        data_type: string
        tests:
          - not_null
          - unique

      - name: customer_id
        data_type: string
        tests:
          - not_null

      - name: rental_id
        data_type: string

      - name: inventory_id
        data_type: string

      - name: staff_id
        data_type: string

      - name: store_id
        data_type: string

      - name: survey_timestamp
        data_type: timestamp

      - name: rating_overall
        data_type: integer

      - name: rating_service
        data_type: integer

      - name: rating_price
        data_type: integer

      - name: rating_vehicle
        data_type: integer

      - name: nps_score
        data_type: integer

      - name: nps_category
        data_type: string
        tests:
          - accepted_values:
              values: ['promoter', 'passive', 'detractor']

      - name: rating_category
        data_type: string
        tests:
          - accepted_values:
              values: ['positive', 'neutral', 'negative']

      - name: comment_text
        data_type: string

      - name: location
        data_type: string

      - name: device_type
        data_type: string

      - name: age_segment
        data_type: string
        description: Standardized segment sourced from dp_customer_demographics
        tests:
          - accepted_values:
              values: ['young', 'adult', 'senior', 'unknown']