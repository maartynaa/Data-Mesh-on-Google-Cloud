version: 2

models:
  - name: dp_customer_segmentation

    description: >
      Produkt oparty na danych segmentacji behawioralnej klientów, łączący profil klienta
      i aktywność sprzedażową, wzbogacony o segmentację behawioralną i informacje o preferencjach dotyczących pojazdów.
      Wykorzystywany do targetowania marketingowego, analityki CRM i strategii grupowania klientów.

    config:
      materialized: table
      schema: crm_data_products
      contract:
        enforced: true

    meta:
      contract:
        id: dp_customer_segmentation
        version: 1.1.0
        domain: crm
        owner: crm_team

        address: bw-bigdata-2026-data-mesh.crm_data_products.dp_customer_segmentation

        grain: one row per customer

        primary_key:
          - customer_id

        refresh: daily

        consumers:
          - crm_team
          - marketing_team

        sources:
          - dp_customer_profile
          - dp_customer_sales_activity
          - dp_car_catalog

        sla:
          freshness: daily
          availability: 99%

    columns:
      - name: customer_id
        description: Unikalny identyfikator klienta
        data_type: string
        tests:
          - not_null
          - unique

      - name: age_segment
        description: Grupa wiekowa (young, adult, senior, unknown)
        data_type: string
        tests:
          - accepted_values:
              values: ['young', 'adult', 'senior', 'unknown']

      - name: country
        description: Kraj klienta
        data_type: string

      - name: rental_count
        description: Suma wypożyczeń klienta
        data_type: integer

      - name: last_rental_date
        description: Data ostatniego wypożyczenia klienta
        data_type: date

      - name: total_expected_rental_amount
        description: TO DO
        data_type: numeric

      - name: total_paid_amount
        description: Suma wszystkich kwot zapłaconych przez klienta za wypożyczenia
        data_type: numeric

      - name: payment_status
        description: Status płatności
        data_type: string

      - name: mobility_segment
        description: TO DO
        data_type: string

      - name: recommended_brand
        description: Rekomendowana marka samochodu
        data_type: string

      - name: recommended_model
        description: Rekomendowany model samochodu
        data_type: string

      - name: fuel_type
        description: TO DO
        data_type: string

      - name: vehicle_segment
        description: TO DO
        data_type: string