id: customer_profile
domain: crm
owner: crm_team

description: >
  Enriched customer profile combining identity and geographic attributes.
  PII fields are hashed with SHA-256 and not exposed in plain text.
  Provides a unified view of customer demographics and location
  for segmentation, reporting and analytics.

data_product: dp_customer_profile

depends_on:
  - wheelie.customer
  - wheelie.address
  - wheelie.city
  - wheelie.country

sla:
  freshness: daily
  availability: 99%

use_cases:
  - customer segmentation
  - demographic analytics
  - geographic reporting
  - base profile for cross-domain enrichment

meta:
  business_rules:
    age_segment:
      young:   age < 25
      adult:   age >= 25 and age <= 50
      senior:  age > 50
      unknown: age is null

columns:
  - name: customer_id
    description: Unique identifier of the customer

  - name: first_name_hash
    description: Customer first name hashed with SHA-256

  - name: last_name_hash
    description: Customer last name hashed with SHA-256

  - name: email_hash
    description: Customer email address hashed with SHA-256

  - name: is_valid_email
    description: Boolean flag indicating whether the original email address is valid

  - name: birth_date
    description: Customer date of birth

  - name: age
    description: Customer age in years derived from birth_date

  - name: age_segment
    description: >
      Customer age segment derived from age:
      young (< 25), adult (25-50), senior (> 50), unknown

  - name: create_date
    description: Date when the customer account was created

  - name: customer_last_update
    description: Timestamp of the last update to the customer record

  - name: city
    description: City of the customer derived from address data

  - name: country
    description: Country of the customer derived from address data