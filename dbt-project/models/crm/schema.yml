version: 2

models:
  # ==========================================
  # 1. KONTRAKT: CUSTOMER
  # ==========================================
  - name: customer
    description: "Pełny profil klienta w domenie CRM (zawiera dane PII)."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: email
        data_type: string
      - name: address_id
        data_type: int64
      - name: birth_date
        data_type: date
      - name: create_date
        data_type: timestamp
      - name: last_update
        data_type: timestamp

  # ==========================================
  # 2. KONTRAKT: ADDRESS
  # ==========================================
  - name: address
    description: "Dane adresowe powiązane z klientami i sklepami."
    config:
      contract:
        enforced: true
    columns:
      - name: address_id
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: address
        data_type: string
      - name: address2
        data_type: string
      - name: city_id
        data_type: int64
      - name: postal_code
        data_type: string
      - name: last_update
        data_type: timestamp

  # ==========================================
  # 3. KONTRAKT: CITY
  # ==========================================
  - name: city
    description: "Słownik miast."
    config:
      contract:
        enforced: true
    columns:
      - name: city_id
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: city
        data_type: string
      - name: country_id
        data_type: int64

  # ==========================================
  # 4. KONTRAKT: COUNTRY
  # ==========================================
  - name: country
    description: "Słownik państw."
    config:
      contract:
        enforced: true
    columns:
      - name: country_id
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: country
        data_type: string

  # ==========================================
  # 5. KONTRAKT: STAFF
  # ==========================================
  - name: staff
    description: "Dane pracowników wypożyczalni samochodów."
    config:
      contract:
        enforced: true
    columns:
      - name: staff_id
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: address_id
        data_type: int64
      - name: email
        data_type: string
      - name: store_id
        data_type: int64
      - name: manager_id
        data_type: int64
      - name: hired_date
        data_type: date
      - name: last_update
        data_type: timestamp

  # ==========================================
  # 6. KONTRAKT: STORE
  # ==========================================
  - name: store
    description: "Lista fizycznych punktów/oddziałów wypożyczalni."
    config:
      contract:
        enforced: true
    columns:
      - name: store_id
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: store_manager_id
        data_type: int64
      - name: address_id
        data_type: int64
      - name: last_update
        data_type: timestamp